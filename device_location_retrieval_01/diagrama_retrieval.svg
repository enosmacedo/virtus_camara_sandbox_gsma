<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1400" height="1000" fill="#ffffff"/>

  <!-- Título -->
  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">API CAMARA Device Location Retrieval no sandbox GSMA Open Gateway</text>
  <text x="40" y="82" font-size="17" fill="#475569">“Onde está este celular?” A resposta é uma área: círculo ou polígono</text>
  <rect x="1010" y="62" width="350" height="30" rx="15" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1185" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Testado no sandbox · 200 chamadas</text>

  <!-- Script -->
  <rect x="40" y="115" width="340" height="235" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="148" font-size="20" font-weight="700" fill="#1e3a8a">Nosso script (Node.js)</text>
  <text x="60" y="173" font-size="13.5" fill="#334155">teste_localizacao.js · caso_real.js</text>
  <text x="60" y="192" font-size="13.5" fill="#334155">varredura_localizacao.js</text>
  <rect x="56" y="206" width="308" height="128" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <g font-family="Consolas, monospace" font-size="12.5" fill="#0f172a">
    <text x="66" y="226" font-weight="700">POST /device-location-retrieval</text>
    <text x="66" y="243" font-weight="700">     /v0.3/retrieve</text>
    <text x="66" y="268">{ "device": {</text>
    <text x="66" y="285">    "phoneNumber": <tspan fill="#b91c1c" font-weight="700">"+1555000XX"</tspan> },</text>
    <text x="66" y="302">  "maxAge": 120 }</text>
    <text x="66" y="324" fill="#64748b">maxAge: idade máx. da posição (s)</text>
  </g>

  <line x1="380" y1="232" x2="418" y2="232" stroke="#334155" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Sandbox -->
  <rect x="420" y="115" width="940" height="235" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="440" y="148" font-size="19" font-weight="700" fill="#14532d">Sandbox: devolve uma área conforme o final do telefone</text>

  <rect x="440" y="162" width="440" height="172" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="456" y="184" font-size="14" font-weight="700" fill="#166534">CIRCLE · finais 00–49 e 94–99</text>
  <g font-family="Consolas, monospace" font-size="12" fill="#0f172a">
    <text x="456" y="208">"lastLocationTime": "&lt;agora&gt;",</text>
    <text x="456" y="226">"area": { "areaType": "CIRCLE",</text>
    <text x="456" y="244">  "center": { "latitude": 45.754,</text>
    <text x="456" y="262">              "longitude": 4.86 },</text>
    <text x="456" y="280">  "radius": 800 }</text>
  </g>
  <circle cx="815" cy="270" r="44" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="815" cy="270" r="4" fill="#166534"/>
  <line x1="815" y1="270" x2="859" y2="270" stroke="#166534" stroke-width="1.5"/>
  <text x="837" y="264" text-anchor="middle" font-size="11" fill="#166534">800 m</text>

  <rect x="900" y="162" width="440" height="172" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="916" y="184" font-size="14" font-weight="700" fill="#1e40af">POLYGON · finais 50–89</text>
  <g font-family="Consolas, monospace" font-size="12" fill="#0f172a">
    <text x="916" y="208">"lastLocationTime": "&lt;agora&gt;",</text>
    <text x="916" y="226">"area": { "areaType": "POLYGON",</text>
    <text x="916" y="244">  "boundary": [</text>
    <text x="916" y="262">    {45.754, 4.86}, {45.7541, 4.8601},</text>
    <text x="916" y="280">    {45.7542, 4.8602}, {45.754, 4.86} ] }</text>
  </g>
  <polygon points="1240,312 1300,236 1325,300" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2"/>
  <g fill="#1e40af"><circle cx="1240" cy="312" r="3.5"/><circle cx="1300" cy="236" r="3.5"/><circle cx="1325" cy="300" r="3.5"/></g>
  <text x="1182" y="322" font-size="11" fill="#1e40af">~17 m, 3 pontos</text>

  <!-- Tabela de finais -->
  <rect x="40" y="380" width="650" height="270" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="58" y="412" font-size="19" font-weight="700" fill="#0f172a">Final do telefone → resposta</text>
  <text x="58" y="434" font-size="13.5" fill="#475569">igual com e sem maxAge</text>
  <g font-size="14">
    <rect x="50" y="448" width="630" height="28" rx="5" fill="#dcfce7"/>
    <text x="62" y="467" font-weight="700" fill="#0f172a">00–49, 94–99</text><text x="210" y="467" font-weight="700" fill="#166534">200 · CIRCLE</text><text x="350" y="467" fill="#166534">círculo de 800 m</text>
    <rect x="50" y="480" width="630" height="28" rx="5" fill="#dbeafe"/>
    <text x="62" y="499" font-weight="700" fill="#0f172a">50–89</text><text x="210" y="499" font-weight="700" fill="#1e40af">200 · POLYGON</text><text x="350" y="499" fill="#1e40af">polígono de 3 pontos</text>
    <rect x="50" y="512" width="630" height="28" rx="5" fill="#f8fafc"/>
    <text x="62" y="531" font-weight="700" fill="#0f172a">90</text><text x="210" y="531" fill="#475569">400 INVALID_ARGUMENT</text>
    <rect x="50" y="544" width="630" height="28" rx="5" fill="#f8fafc"/>
    <text x="62" y="563" font-weight="700" fill="#0f172a">91</text><text x="210" y="563" fill="#475569">401 UNAUTHENTICATED</text>
    <rect x="50" y="576" width="630" height="28" rx="5" fill="#fee2e2"/>
    <text x="62" y="595" font-weight="700" fill="#0f172a">92</text><text x="210" y="595" fill="#991b1b">404 LOCATION_RETRIEVAL.DEVICE_NOT_FOUND</text>
    <rect x="50" y="608" width="630" height="28" rx="5" fill="#f8fafc"/>
    <text x="62" y="627" font-weight="700" fill="#0f172a">93</text><text x="210" y="627" fill="#475569">503 UNAVAILABLE</text>
  </g>

  <!-- Cenários da página x varredura -->
  <rect x="710" y="380" width="650" height="270" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="728" y="412" font-size="19" font-weight="700" fill="#0f172a">Cenários da página × o que encontramos</text>
  <g font-size="14" fill="#0f172a">
    <text x="728" y="446">Circle</text><text x="960" y="446" fill="#166534">✓ finais 00–49, 94–99</text>
    <text x="728" y="474">Polygon</text><text x="960" y="474" fill="#166534">✓ finais 50–89</text>
    <text x="728" y="502">No Maxage (Success)</text><text x="960" y="502" fill="#166534">✓ sem maxAge: mesmas respostas</text>
    <text x="728" y="530">Error Invalid Phone</text><text x="960" y="530" fill="#166534">✓ final 90 (400)</text>
    <text x="728" y="558">Error Device Not Found</text><text x="960" y="558" fill="#166534">✓ final 92 (404)</text>
    <text x="728" y="586">Error Service Unavailable</text><text x="960" y="586" fill="#166534">✓ final 93 (503)</text>
    <text x="728" y="614">Error Permission Denied</text><text x="960" y="614" fill="#b45309" font-weight="700">⚠ não aparece: 91 dá 401</text>
  </g>

  <!-- Pontos de atenção -->
  <rect x="40" y="680" width="1320" height="290" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="714" font-size="20" font-weight="700" fill="#78350f">O que descobrimos</text>
  <g font-size="15" fill="#1f2937">
    <text x="60" y="752"><tspan font-weight="700">1. A posição é sempre “agora”.</tspan></text>
    <text x="80" y="774">lastLocationTime vem com o horário da consulta: não dá</text>
    <text x="80" y="796">para simular “posição antiga” no sandbox.</text>
    <text x="60" y="834"><tspan font-weight="700">2. O lugar é sempre o mesmo.</tspan></text>
    <text x="80" y="856">Centro em Lyon (45.754, 4.86) para qualquer número.</text>
    <text x="60" y="894"><tspan font-weight="700">3. maxAge não muda nada.</tspan></text>
    <text x="80" y="916">Com 120, 1, 0 ou sem o campo: mesma resposta.</text>

    <text x="720" y="752"><tspan font-weight="700">4. O polígono é minúsculo (~17 m).</tspan></text>
    <text x="740" y="774">3 pontos, e o 1º se repete no fim para fechar a figura.</text>
    <text x="740" y="796">O código precisa saber tratar círculo e polígono.</text>
    <text x="720" y="834"><tspan font-weight="700">5. “Permission Denied” não foi reproduzido.</tspan></text>
    <text x="740" y="856">A página lista o cenário, mas nenhum final devolve 403.</text>
    <text x="720" y="894"><tspan font-weight="700">6. Uma falha passageira.</tspan></text>
    <text x="740" y="916">O final 44 deu 400 uma vez; repetido, deu 200.</text>
  </g>
  <text x="60" y="952" font-size="14" fill="#78350f">Em produção a área depende da rede (antenas): em cidade, centenas de metros; em estrada, pode passar de quilômetros.</text>
</svg>
