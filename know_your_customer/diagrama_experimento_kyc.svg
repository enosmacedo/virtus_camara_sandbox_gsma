<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1140" viewBox="0 0 1400 1140" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1400" height="1140" fill="#ffffff"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">Experimento: API CAMARA Know Your Customer no sandbox GSMA Open Gateway</text>
  <text x="40" y="82" font-size="17" fill="#475569">300 chamadas (finais 00–99 × 3 endpoints) para mapear como o sandbox responde</text>

  <rect x="40" y="120" width="300" height="190" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="155" font-size="20" font-weight="700" fill="#1e3a8a">Nosso script (Node.js)</text>
  <text x="60" y="183" font-size="14" fill="#334155">teste_kyc.js · varredura_kyc.js</text>
  <text x="60" y="203" font-size="14" fill="#334155">sondagem_dados.js · sondagem_tenure_data.js</text>
  <text x="60" y="240" font-size="14" fill="#334155">Telefone de teste:</text>
  <text x="60" y="266" font-family="Consolas, monospace" font-size="17" fill="#0f172a">+1555000<tspan fill="#b91c1c" font-weight="700">XX</tspan></text>
  <text x="60" y="292" font-size="13" fill="#b91c1c" font-weight="700">XX = 00 a 99</text>

  <rect x="400" y="120" width="280" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="420" y="155" font-size="19" font-weight="700" fill="#4c1d95">Autenticação GSMA</text>
  <text x="420" y="182" font-size="14" fill="#334155">fluxo Client Credentials</text>
  <text x="420" y="204" font-size="14" fill="#334155">token vale 5 minutos</text>
  <text x="420" y="226" font-size="14" fill="#334155">escopos kyc-*</text>

  <rect x="740" y="110" width="620" height="210" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="760" y="145" font-size="19" font-weight="700" fill="#14532d">Sandbox KYC (mock CAMARA)</text>
  <g font-size="13.5" fill="#334155">
    <text x="760" y="178" font-family="Consolas, monospace">POST /kyc-age-verification/v0.1/verify</text><text x="1095" y="178">→ maior de 18 anos?</text>
    <text x="760" y="204" font-family="Consolas, monospace">POST /kyc-match/v0.2/match</text><text x="1095" y="204">→ os dados batem?</text>
    <text x="760" y="230" font-family="Consolas, monospace">POST /kyc-tenure/v0.1/check-tenure</text><text x="1095" y="230">→ linha antiga?</text>
  </g>
  <rect x="760" y="248" width="580" height="54" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1050" y="281" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Responde pelos 2 últimos dígitos (no Tenure, também pela data)</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="340" y1="185" x2="398" y2="185" marker-end="url(#seta)"/>
    <line x1="340" y1="285" x2="738" y2="285" marker-end="url(#seta)"/>
  </g>
  <text x="347" y="176" font-size="13" font-weight="700" fill="#0f172a">① token</text>
  <text x="420" y="277" font-size="13" font-weight="700" fill="#0f172a">② POST com o telefone + dados</text>
  <text x="420" y="305" font-size="13" fill="#0f172a">③ resposta conforme o final</text>

<rect x="40" y="360" width="414" height="496" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="56" y="392" font-size="19" font-weight="700" fill="#0f172a">Age Verification</text>
<text x="56" y="414" font-size="14" fill="#475569">O titular tem 18 anos ou mais?</text>
<text x="56" y="440" font-size="12" font-weight="700" fill="#64748b">FINAL</text><text x="205" y="440" font-size="12" font-weight="700" fill="#64748b">RESPOSTA</text>
<rect x="48" y="448" width="398" height="26" rx="5" fill="#dcfce7"/><text x="56" y="466" font-size="13" font-weight="700" fill="#0f172a">00–19, 94–99</text><text x="205" y="466" font-size="13" fill="#166534" font-weight="600">Maior de idade · confiança 95</text>
<rect x="48" y="477" width="398" height="26" rx="5" fill="#ecfccb"/><text x="56" y="495" font-size="13" font-weight="700" fill="#0f172a">20–29</text><text x="205" y="495" font-size="13" fill="#3f6212" font-weight="600">Maior · não verificado · 75</text>
<rect x="48" y="506" width="398" height="26" rx="5" fill="#fee2e2"/><text x="56" y="524" font-size="13" font-weight="700" fill="#0f172a">30–39</text><text x="205" y="524" font-size="13" fill="#991b1b" font-weight="600">Menor de idade · confiança 90</text>
<rect x="48" y="535" width="398" height="26" rx="5" fill="#fee2e2"/><text x="56" y="553" font-size="13" font-weight="700" fill="#0f172a">40–49</text><text x="205" y="553" font-size="13" fill="#991b1b" font-weight="600">Menor · não verificado · 45</text>
<rect x="48" y="564" width="398" height="26" rx="5" fill="#f1f5f9"/><text x="56" y="582" font-size="13" font-weight="700" fill="#0f172a">50–59</text><text x="205" y="582" font-size="13" fill="#334155" font-weight="600">Sem dados · confiança 20</text>
<rect x="48" y="593" width="398" height="26" rx="5" fill="#dcfce7"/><text x="56" y="611" font-size="13" font-weight="700" fill="#0f172a">60–69</text><text x="205" y="611" font-size="13" fill="#166534" font-weight="600">Maior de idade · confiança 100</text>
<rect x="48" y="622" width="398" height="26" rx="5" fill="#ecfccb"/><text x="56" y="640" font-size="13" font-weight="700" fill="#0f172a">70–79</text><text x="205" y="640" font-size="13" fill="#3f6212" font-weight="600">Maior · não verificado · 65</text>
<rect x="48" y="651" width="398" height="26" rx="5" fill="#f8fafc"/><text x="56" y="669" font-size="13" font-weight="700" fill="#0f172a">80–89, 92–93</text><text x="205" y="669" font-size="13" fill="#475569">400 INVALID_ARGUMENT</text>
<rect x="48" y="680" width="398" height="26" rx="5" fill="#f8fafc"/><text x="56" y="698" font-size="13" font-weight="700" fill="#0f172a">90</text><text x="205" y="698" font-size="13" fill="#475569">404 IDENTIFIER_NOT_FOUND</text>
<rect x="48" y="709" width="398" height="26" rx="5" fill="#f8fafc"/><text x="56" y="727" font-size="13" font-weight="700" fill="#0f172a">91</text><text x="205" y="727" font-size="13" fill="#475569">403 PERMISSION_DENIED</text>
<rect x="493" y="360" width="414" height="496" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="509" y="392" font-size="19" font-weight="700" fill="#0f172a">KYC Match</text>
<text x="509" y="414" font-size="14" fill="#475569">Os dados batem com o cadastro da operadora?</text>
<text x="509" y="440" font-size="12" font-weight="700" fill="#64748b">FINAL</text><text x="658" y="440" font-size="12" font-weight="700" fill="#64748b">RESPOSTA</text>
<rect x="501" y="448" width="398" height="26" rx="5" fill="#dcfce7"/><text x="509" y="466" font-size="13" font-weight="700" fill="#0f172a">00–09, 95–99</text><text x="658" y="466" font-size="13" fill="#166534" font-weight="600">Perfeito: todos os campos batem</text>
<rect x="501" y="477" width="398" height="26" rx="5" fill="#ecfccb"/><text x="509" y="495" font-size="13" font-weight="700" fill="#0f172a">10–19</text><text x="658" y="495" font-size="13" fill="#3f6212" font-weight="600">Parcial alto (e-mail 90%)</text>
<rect x="501" y="506" width="398" height="26" rx="5" fill="#fef3c7"/><text x="509" y="524" font-size="13" font-weight="700" fill="#0f172a">20–39</text><text x="658" y="524" font-size="13" fill="#92400e" font-weight="600">Parcial misto (nome 45%)</text>
<rect x="501" y="535" width="398" height="26" rx="5" fill="#fee2e2"/><text x="509" y="553" font-size="13" font-weight="700" fill="#0f172a">40–59</text><text x="658" y="553" font-size="13" fill="#991b1b" font-weight="600">Baixo: nada bate</text>
<rect x="501" y="564" width="398" height="26" rx="5" fill="#f1f5f9"/><text x="509" y="582" font-size="13" font-weight="700" fill="#0f172a">60–69</text><text x="658" y="582" font-size="13" fill="#334155" font-weight="600">Sem dados (not_available)</text>
<rect x="501" y="593" width="398" height="26" rx="5" fill="#dbeafe"/><text x="509" y="611" font-size="13" font-weight="700" fill="#0f172a">70–79</text><text x="658" y="611" font-size="13" fill="#1e40af" font-weight="600">Empresa: sem nascimento/gênero</text>
<rect x="501" y="622" width="398" height="26" rx="5" fill="#f8fafc"/><text x="509" y="640" font-size="13" font-weight="700" fill="#0f172a">80–91, 93</text><text x="658" y="640" font-size="13" fill="#475569">400 INVALID_ARGUMENT</text>
<rect x="501" y="651" width="398" height="26" rx="5" fill="#f8fafc"/><text x="509" y="669" font-size="13" font-weight="700" fill="#0f172a">92</text><text x="658" y="669" font-size="13" fill="#475569">404 NOT_FOUND</text>
<rect x="501" y="680" width="398" height="26" rx="5" fill="#f8fafc"/><text x="509" y="698" font-size="13" font-weight="700" fill="#0f172a">94 *</text><text x="658" y="698" font-size="13" fill="#475569">403 ID_DOCUMENT_REQUIRED</text>
<text x="509" y="731" font-size="12.5" fill="#64748b">* enviando idDocument, o final 94 vira “perfeito”</text>
<rect x="946" y="360" width="414" height="496" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="962" y="392" font-size="19" font-weight="700" fill="#0f172a">KYC Tenure</text>
<text x="962" y="414" font-size="14" fill="#475569">Ativa desde a data? (enviada: 2020-01-01)</text>
<text x="962" y="440" font-size="12" font-weight="700" fill="#64748b">FINAL</text><text x="1111" y="440" font-size="12" font-weight="700" fill="#64748b">RESPOSTA</text>
<rect x="954" y="448" width="398" height="26" rx="5" fill="#dcfce7"/><text x="962" y="466" font-size="13" font-weight="700" fill="#0f172a">00–09, 80–89, 96–99</text><text x="1111" y="466" font-size="13" fill="#166534" font-weight="600">✓ ativa desde a data · pós-pago</text>
<rect x="954" y="477" width="398" height="26" rx="5" fill="#dcfce7"/><text x="962" y="495" font-size="13" font-weight="700" fill="#0f172a">10–19 *</text><text x="1111" y="495" font-size="13" fill="#166534" font-weight="600">✓ ativa desde a data · pré-pago</text>
<rect x="954" y="506" width="398" height="26" rx="5" fill="#dcfce7"/><text x="962" y="524" font-size="13" font-weight="700" fill="#0f172a">20–29 *</text><text x="1111" y="524" font-size="13" fill="#166534" font-weight="600">✓ ativa desde a data · empresa</text>
<rect x="954" y="535" width="398" height="26" rx="5" fill="#dcfce7"/><text x="962" y="553" font-size="13" font-weight="700" fill="#0f172a">30–39</text><text x="1111" y="553" font-size="13" fill="#166534" font-weight="600">✓ ativa desde a data · premium</text>
<rect x="954" y="564" width="398" height="26" rx="5" fill="#dcfce7"/><text x="962" y="582" font-size="13" font-weight="700" fill="#0f172a">40–49</text><text x="1111" y="582" font-size="13" fill="#166534" font-weight="600">✓ ativa desde a data · sem tipo</text>
<rect x="954" y="593" width="398" height="26" rx="5" fill="#fee2e2"/><text x="962" y="611" font-size="13" font-weight="700" fill="#0f172a">50–59</text><text x="1111" y="611" font-size="13" fill="#991b1b" font-weight="600">✗ linha mais nova · sem tipo</text>
<rect x="954" y="622" width="398" height="26" rx="5" fill="#fee2e2"/><text x="962" y="640" font-size="13" font-weight="700" fill="#0f172a">60–69</text><text x="1111" y="640" font-size="13" fill="#991b1b" font-weight="600">✗ linha mais nova · pós-pago</text>
<rect x="954" y="651" width="398" height="26" rx="5" fill="#fee2e2"/><text x="962" y="669" font-size="13" font-weight="700" fill="#0f172a">70–79</text><text x="1111" y="669" font-size="13" fill="#991b1b" font-weight="600">✗ linha mais nova · pré-pago</text>
<rect x="954" y="680" width="398" height="26" rx="5" fill="#f8fafc"/><text x="962" y="698" font-size="13" font-weight="700" fill="#0f172a">90, 93</text><text x="1111" y="698" font-size="13" fill="#475569">400 INVALID_ARGUMENT</text>
<rect x="954" y="709" width="398" height="26" rx="5" fill="#f8fafc"/><text x="962" y="727" font-size="13" font-weight="700" fill="#0f172a">91</text><text x="1111" y="727" font-size="13" fill="#475569">403 PERMISSION_DENIED</text>
<rect x="954" y="738" width="398" height="26" rx="5" fill="#f8fafc"/><text x="962" y="756" font-size="13" font-weight="700" fill="#0f172a">92</text><text x="1111" y="756" font-size="13" fill="#475569">404 IDENTIFIER_NOT_FOUND</text>
<rect x="954" y="767" width="398" height="26" rx="5" fill="#f8fafc"/><text x="962" y="785" font-size="13" font-weight="700" fill="#0f172a">94</text><text x="1111" y="785" font-size="13" fill="#475569">422 MISSING_IDENTIFIER</text>
<rect x="954" y="796" width="398" height="26" rx="5" fill="#f8fafc"/><text x="962" y="814" font-size="13" font-weight="700" fill="#0f172a">95</text><text x="1111" y="814" font-size="13" fill="#475569">422 UNNECESSARY_IDENTIFIER</text>
<text x="962" y="847" font-size="12.5" fill="#64748b">* com data a partir de 2024: ✗ linha mais nova</text>

  <rect x="40" y="870" width="1320" height="250" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="904" font-size="20" font-weight="700" fill="#78350f">O que descobrimos</text>
<circle cx="72" cy="935" r="12" fill="#d97706"/><text x="72" y="940" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text><text x="92" y="940" font-size="15" font-weight="700" fill="#1f2937">Quase sempre, só o final decide.</text><text x="92" y="962" font-size="14" fill="#374151">Nome trocado e idade mínima 12 ou 99: mesma</text><text x="92" y="982" font-size="14" fill="#374151">resposta. Exceção: no Tenure, a data importa (*).</text>
<circle cx="512" cy="935" r="12" fill="#d97706"/><text x="512" y="940" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text><text x="532" y="940" font-size="15" font-weight="700" fill="#1f2937">Documentação inconsistente.</text><text x="532" y="962" font-size="14" fill="#374151">O exemplo oficial “Verify Age – Adult” (+155500030)</text><text x="532" y="982" font-size="14" fill="#374151">devolve ageCheck false, ou seja, menor de idade.</text>
<circle cx="952" cy="935" r="12" fill="#d97706"/><text x="952" y="940" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text><text x="972" y="940" font-size="15" font-weight="700" fill="#1f2937">Final 94 do Match exige documento (403).</text><text x="972" y="962" font-size="14" fill="#374151">Enviando o campo idDocument, a resposta</text><text x="972" y="982" font-size="14" fill="#374151">passa a ser “perfeito”.</text>
<circle cx="72" cy="1027" r="12" fill="#d97706"/><text x="72" y="1032" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text><text x="92" y="1032" font-size="15" font-weight="700" fill="#1f2937">Campos aparecem e somem conforme o cenário.</text><text x="92" y="1054" font-size="14" fill="#374151">Ex.: contractType e os *MatchScore. O código</text><text x="92" y="1074" font-size="14" fill="#374151">precisa tratar campo ausente.</text>
<circle cx="512" cy="1027" r="12" fill="#d97706"/><text x="512" y="1032" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text><text x="532" y="1032" font-size="15" font-weight="700" fill="#1f2937">Resultados vêm como texto, não booleano.</text><text x="532" y="1054" font-size="14" fill="#374151">"true", "false", "not_available" (exceto</text><text x="532" y="1074" font-size="14" fill="#374151">verifiedStatus e tenureDateCheck).</text>
<circle cx="952" cy="1027" r="12" fill="#d97706"/><text x="952" y="1032" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text><text x="972" y="1032" font-size="15" font-weight="700" fill="#1f2937">Fill-in não está disponível.</text><text x="972" y="1054" font-size="14" fill="#374151">O escopo kyc-fill-in vem no token, mas o</text><text x="972" y="1074" font-size="14" fill="#374151">sandbox não tem endpoint para ele.</text>

</svg>
