<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1400" height="1050" fill="#ffffff"/>

  <!-- Título -->
  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">API CAMARA One Time Password SMS no sandbox GSMA Open Gateway</text>
  <text x="40" y="82" font-size="17" fill="#475569">Fluxo em duas chamadas e respostas mapeadas por varredura (finais 00–99)</text>
  <rect x="1010" y="62" width="350" height="30" rx="15" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1185" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Testado no sandbox · 200 chamadas</text>

  <!-- Participantes -->
  <rect x="100" y="115" width="240" height="56" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">App / backend</text>
  <text x="220" y="160" text-anchor="middle" font-size="13" fill="#334155">nosso sistema</text>
  <rect x="560" y="115" width="280" height="56" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="700" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">Operadora</text>
  <text x="700" y="160" text-anchor="middle" font-size="13" fill="#334155">sandbox GSMA (mock CAMARA)</text>
  <rect x="1060" y="115" width="240" height="56" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="1180" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Celular do cliente</text>
  <text x="1180" y="160" text-anchor="middle" font-size="13" fill="#334155">recebe o SMS</text>

  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 6">
    <line x1="220" y1="171" x2="220" y2="580"/>
    <line x1="700" y1="171" x2="700" y2="580"/>
    <line x1="1180" y1="171" x2="1180" y2="580"/>
  </g>

  <!-- Mensagens -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="222" y1="225" x2="696" y2="225" marker-end="url(#seta)"/>
    <line x1="698" y1="290" x2="224" y2="290" marker-end="url(#seta)"/>
    <line x1="702" y1="355" x2="1176" y2="355" marker-end="url(#seta)"/>
    <line x1="1178" y1="420" x2="224" y2="420" stroke-dasharray="8 6" marker-end="url(#seta)"/>
    <line x1="222" y1="485" x2="696" y2="485" marker-end="url(#seta)"/>
    <line x1="698" y1="550" x2="224" y2="550" marker-end="url(#seta)"/>
  </g>
  <g font-size="14" fill="#0f172a">
    <text x="240" y="215" font-weight="700">① POST /one-time-password-sms/v1/send-code</text>
    <text x="240" y="245" font-family="Consolas, monospace" font-size="12.5" fill="#334155">{ phoneNumber, message: "{{code}} é seu código" }</text>

    <text x="240" y="280" font-weight="700">② 200 · authenticationId (o “protocolo”)</text>
    <text x="240" y="310" font-family="Consolas, monospace" font-size="12.5" fill="#334155">{ authenticationId: "ea0840f3-…" }</text>

    <text x="720" y="345" font-weight="700">③ gera o código e envia o SMS</text>
    <text x="720" y="375" font-family="Consolas, monospace" font-size="12.5" fill="#334155">"123410 é seu código"</text>

    <text x="740" y="410" font-weight="700">④ o cliente lê o SMS e digita 123410 no app</text>

    <text x="240" y="475" font-weight="700">⑤ POST /one-time-password-sms/v1/validate-code</text>
    <text x="240" y="505" font-family="Consolas, monospace" font-size="12.5" fill="#334155">{ authenticationId, code: "123410" }</text>

    <text x="240" y="540" font-weight="700">⑥ 204 · código correto (resposta sem corpo)</text>
  </g>

  <rect x="860" y="460" width="480" height="96" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="880" y="487" width="22" height="18" rx="3" fill="#0e7490"/>
  <path d="M884,487 v-6 a7,7 0 0 1 14,0 v6" stroke="#0e7490" stroke-width="3" fill="none"/>
  <text x="916" y="494" font-size="16" font-weight="700" fill="#155e75">O app nunca vê o código</text>
  <text x="916" y="518" font-size="14" fill="#155e75">Só a operadora e o celular do cliente conhecem.</text>
  <text x="916" y="539" font-size="14" fill="#155e75">Prazo e limite de tentativas ficam com a operadora.</text>

  <!-- Tabela envio -->
  <rect x="40" y="610" width="650" height="240" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="58" y="642" font-size="19" font-weight="700" fill="#0f172a">send-code</text>
  <text x="160" y="642" font-size="15" fill="#475569">decide pelo final do <tspan font-weight="700" fill="#b91c1c">TELEFONE</tspan></text>
  <g font-size="14">
    <rect x="50" y="656" width="630" height="28" rx="5" fill="#dcfce7"/>
    <text x="62" y="675" font-weight="700" fill="#0f172a">00–19, 80–89 *, 94–99</text><text x="250" y="675" font-weight="700" fill="#166534">200 Success</text><text x="420" y="675" fill="#166534">SMS enviado + protocolo</text>
    <rect x="50" y="688" width="630" height="28" rx="5" fill="#fef3c7"/>
    <text x="62" y="707" font-weight="700" fill="#0f172a">20–39</text><text x="250" y="707" font-weight="700" fill="#92400e">403 MAX_OTP_CODES</text><text x="420" y="707" fill="#92400e">códigos demais pedidos</text>
    <rect x="50" y="720" width="630" height="28" rx="5" fill="#fee2e2"/>
    <text x="62" y="739" font-weight="700" fill="#0f172a">40–59</text><text x="250" y="739" font-weight="700" fill="#991b1b">403 NOT_ALLOWED</text><text x="420" y="739" fill="#991b1b">operadora não permite SMS</text>
    <rect x="50" y="752" width="630" height="28" rx="5" fill="#fee2e2"/>
    <text x="62" y="771" font-weight="700" fill="#0f172a">60–79, 82</text><text x="250" y="771" font-weight="700" fill="#991b1b">403 BLOCKED</text><text x="420" y="771" fill="#991b1b">número bloqueado · <tspan font-weight="700">não documentado</tspan></text>
    <rect x="50" y="784" width="630" height="28" rx="5" fill="#f8fafc"/>
    <text x="62" y="803" font-weight="700" fill="#0f172a">90 · 91 · 92 · 93</text><text x="250" y="803" fill="#475569">400 · 401 · 404 NOT_FOUND · 503</text>
  </g>
  <text x="62" y="834" font-size="12.5" fill="#64748b">* exceto o final 82 · “Phone Not Found” da página = final 92 (404)</text>

  <!-- Tabela validação -->
  <rect x="710" y="610" width="650" height="240" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="728" y="642" font-size="19" font-weight="700" fill="#0f172a">validate-code</text>
  <text x="862" y="642" font-size="15" fill="#475569">decide pelo final do <tspan font-weight="700" fill="#b91c1c">CÓDIGO</tspan> digitado</text>
  <g font-size="14">
    <rect x="720" y="656" width="630" height="28" rx="5" fill="#dcfce7"/>
    <text x="732" y="675" font-weight="700" fill="#0f172a">00–19, 80–89, 97–99</text><text x="920" y="675" font-weight="700" fill="#166534">204 Success</text><text x="1080" y="675" fill="#166534">código aceito</text>
    <rect x="720" y="688" width="630" height="28" rx="5" fill="#fee2e2"/>
    <text x="732" y="707" font-weight="700" fill="#0f172a">20–79, 90, 94–96</text><text x="920" y="707" font-weight="700" fill="#991b1b">400 INVALID_ARGUMENT</text><text x="1135" y="707" fill="#991b1b">recusado (genérico)</text>
    <rect x="720" y="720" width="630" height="28" rx="5" fill="#f8fafc"/>
    <text x="732" y="739" font-weight="700" fill="#0f172a">91 · 92 · 93</text><text x="920" y="739" fill="#475569">401 · 404 NOT_FOUND · 503</text>
    <rect x="720" y="756" width="630" height="74" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-dasharray="5 4"/>
    <text x="736" y="779" font-size="14" font-weight="700" fill="#9a3412">Diferente da documentação:</text>
    <text x="736" y="799" font-size="13.5" fill="#9a3412">“Invalid OTP” (20–39), “Expired” (40–59) e “Failed” (60–79)</text>
    <text x="736" y="818" font-size="13.5" fill="#9a3412">não existem: todos viram o mesmo 400 genérico.</text>
  </g>

  <!-- Pontos de atenção -->
  <rect x="40" y="880" width="1320" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="912" font-size="20" font-weight="700" fill="#78350f">Pontos de atenção</text>
  <g font-size="15" fill="#1f2937">
    <text x="60" y="945"><tspan font-weight="700">1.</tspan> O sandbox não envia SMS de verdade: os números são fictícios.</text>
    <text x="60" y="972"><tspan font-weight="700">2.</tspan> No envio vale o final do telefone; na validação, o final do código.</text>
    <text x="60" y="999"><tspan font-weight="700">3.</tspan> Sucesso na validação é 204, sem corpo: o código não pode esperar JSON.</text>
    <text x="720" y="945"><tspan font-weight="700">4.</tspan> SMS chega a quem está com o chip: vulnerável ao golpe da</text>
    <text x="740" y="967">troca de chip. Em produção, combinar com a API SIM Swap.</text>
    <text x="720" y="999"><tspan font-weight="700">5.</tspan> O authenticationId do sandbox é sempre o mesmo valor fixo.</text>
  </g>
</svg>
