<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <symbol id="loja" overflow="visible">
      <rect x="-26" y="-13" width="52" height="38" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
      <rect x="-30" y="-25" width="60" height="13" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
      <rect x="-18" y="-25" width="9" height="13" fill="#ffffff"/>
      <rect x="0" y="-25" width="9" height="13" fill="#ffffff"/>
      <rect x="-21" y="-6" width="11" height="11" fill="#bae6fd" stroke="#92400e"/>
      <rect x="2" y="1" width="14" height="24" fill="#92400e"/>
    </symbol>
    <symbol id="pessoa" overflow="visible">
      <circle cx="0" cy="-24" r="10"/>
      <path d="M-15,12 Q-15,-11 0,-11 Q15,-11 15,12 Z"/>
    </symbol>
    <symbol id="celular" overflow="visible">
      <rect x="-7" y="-12" width="14" height="24" rx="3" fill="#0f172a"/>
      <rect x="-5" y="-9" width="10" height="16" fill="#60a5fa"/>
    </symbol>
    <symbol id="casa" overflow="visible">
      <rect x="-20" y="-2" width="40" height="30" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
      <polygon points="-27,0 0,-26 27,0" fill="#b45309" stroke="#7c2d12" stroke-width="2"/>
      <rect x="-5" y="10" width="11" height="18" fill="#7c2d12"/>
    </symbol>
  </defs>

  <rect width="1400" height="1030" fill="#ffffff"/>

  <!-- Título -->
  <text x="700" y="52" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">O seu celular ajuda o banco a confirmar que é você</text>
  <text x="700" y="84" text-anchor="middle" font-size="18" fill="#475569">Como a operadora de celular ajuda a evitar fraudes com cartão</text>

  <!-- Passo 1 -->
  <rect x="40" y="110" width="400" height="200" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <use href="#loja" x="190" y="180"/>
  <rect x="250" y="160" width="58" height="38" rx="6" fill="#2563eb"/>
  <rect x="250" y="168" width="58" height="7" fill="#1e3a8a"/>
  <rect x="258" y="182" width="12" height="9" rx="2" fill="#facc15"/>
  <text x="240" y="250" text-anchor="middle" font-size="18" fill="#0f172a"><tspan font-weight="700">1.</tspan> O cliente paga com o cartão</text>
  <text x="240" y="275" text-anchor="middle" font-size="18" fill="#0f172a">em uma loja</text>

  <!-- Passo 2 -->
  <rect x="500" y="110" width="400" height="200" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <g fill="#1e40af">
    <polygon points="588,162 620,142 652,162"/>
    <rect x="592" y="165" width="7" height="26"/><rect x="606" y="165" width="7" height="26"/>
    <rect x="620" y="165" width="7" height="26"/><rect x="634" y="165" width="7" height="26"/>
    <rect x="586" y="192" width="68" height="7"/>
  </g>
  <text x="620" y="220" text-anchor="middle" font-size="14" fill="#475569">Banco</text>
  <line x1="668" y1="172" x2="742" y2="172" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <g stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="785" y1="150" x2="768" y2="200"/>
    <line x1="785" y1="150" x2="802" y2="200"/>
    <line x1="774" y1="182" x2="796" y2="182"/>
    <path d="M770,140 Q762,150 770,160"/><path d="M800,140 Q808,150 800,160"/>
    <path d="M762,132 Q748,150 762,168"/><path d="M808,132 Q822,150 808,168"/>
  </g>
  <text x="785" y="220" text-anchor="middle" font-size="14" fill="#475569">Operadora</text>
  <text x="700" y="255" text-anchor="middle" font-size="18" fill="#0f172a"><tspan font-weight="700">2.</tspan> O banco pergunta à operadora:</text>
  <text x="700" y="282" text-anchor="middle" font-size="17" font-weight="700" fill="#1e40af">“O celular do cliente está perto da loja?”</text>

  <!-- Passo 3 -->
  <rect x="960" y="110" width="400" height="200" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="1105" cy="172" r="28" fill="#16a34a"/>
  <path d="M1092,172 L1102,183 L1120,161" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1215" cy="172" r="28" fill="#dc2626"/>
  <path d="M1203,160 L1227,184 M1227,160 L1203,184" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <text x="1160" y="250" text-anchor="middle" font-size="18" fill="#0f172a"><tspan font-weight="700">3.</tspan> Se está perto: compra aprovada.</text>
  <text x="1160" y="275" text-anchor="middle" font-size="18" fill="#0f172a">Se está longe: bloqueia e avisa.</text>

  <line x1="446" y1="210" x2="494" y2="210" stroke="#64748b" stroke-width="3" marker-end="url(#seta)"/>
  <line x1="906" y1="210" x2="954" y2="210" stroke="#64748b" stroke-width="3" marker-end="url(#seta)"/>

  <!-- Cenário A: compra verdadeira -->
  <rect x="40" y="350" width="640" height="610" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="70" y="392" font-size="24" font-weight="700" fill="#166534">Exemplo 1: compra verdadeira</text>
  <text x="70" y="420" font-size="17" fill="#475569">Ana compra pão na padaria com o próprio cartão</text>

  <rect x="70" y="440" width="580" height="280" rx="10" fill="#ecfccb"/>
  <rect x="70" y="566" width="580" height="18" fill="#ffffff"/>
  <rect x="200" y="440" width="18" height="280" fill="#ffffff"/>
  <rect x="540" y="440" width="18" height="280" fill="#ffffff"/>
  <circle cx="370" cy="585" r="110" fill="#16a34a" fill-opacity="0.13" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="8 6"/>
  <use href="#loja" x="350" y="585"/>
  <text x="350" y="545" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Padaria</text>
  <use href="#pessoa" x="420" y="610" fill="#2563eb"/>
  <use href="#celular" x="440" y="610"/>
  <text x="420" y="650" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a" stroke="#ecfccb" stroke-width="5" paint-order="stroke">Ana e o celular</text>
  <text x="370" y="712" text-anchor="middle" font-size="14" fill="#166534">região próxima da loja</text>

  <rect x="70" y="738" width="580" height="50" rx="10" fill="#eff6ff"/>
  <text x="90" y="770" font-size="18" fill="#0f172a"><tspan font-weight="700">Banco:</tspan> “O celular da Ana está perto da padaria?”</text>
  <rect x="70" y="796" width="580" height="50" rx="10" fill="#f5f3ff"/>
  <text x="90" y="828" font-size="18" fill="#0f172a"><tspan font-weight="700">Operadora:</tspan> “Sim, está.”</text>
  <rect x="70" y="862" width="580" height="70" rx="12" fill="#16a34a"/>
  <text x="360" y="906" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">✓  Compra aprovada na hora</text>

  <!-- Cenário B: cartão clonado -->
  <rect x="720" y="350" width="640" height="610" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <text x="750" y="392" font-size="24" font-weight="700" fill="#991b1b">Exemplo 2: cartão clonado</text>
  <text x="750" y="420" font-size="17" fill="#475569">Um golpista usa uma cópia do cartão do Bruno</text>

  <rect x="750" y="440" width="580" height="280" rx="10" fill="#ecfccb"/>
  <rect x="750" y="636" width="580" height="18" fill="#ffffff"/>
  <rect x="1060" y="440" width="18" height="280" fill="#ffffff"/>
  <circle cx="880" cy="585" r="100" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 6"/>
  <use href="#loja" x="860" y="580"/>
  <text x="860" y="540" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Loja</text>
  <use href="#pessoa" x="918" y="612" fill="#1f2937"/>
  <rect x="907" y="583" width="22" height="6" rx="2" fill="#111827"/>
  <text x="880" y="712" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">golpista com o cartão copiado</text>

  <line x1="985" y1="560" x2="1205" y2="505" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 6" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <text x="1110" y="508" text-anchor="middle" font-size="15" font-style="italic" fill="#475569" transform="rotate(-14 1110 508)">muito longe</text>

  <use href="#casa" x="1245" y="490"/>
  <use href="#pessoa" x="1290" y="512" fill="#2563eb"/>
  <use href="#celular" x="1308" y="512"/>
  <text x="1240" y="560" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Bruno e o celular</text>
  <text x="1240" y="580" text-anchor="middle" font-size="15" fill="#1e3a8a">em casa, em outra cidade</text>

  <rect x="750" y="738" width="580" height="50" rx="10" fill="#eff6ff"/>
  <text x="770" y="770" font-size="18" fill="#0f172a"><tspan font-weight="700">Banco:</tspan> “O celular do Bruno está perto da loja?”</text>
  <rect x="750" y="796" width="580" height="50" rx="10" fill="#f5f3ff"/>
  <text x="770" y="828" font-size="18" fill="#0f172a"><tspan font-weight="700">Operadora:</tspan> “Não, está bem longe.”</text>
  <rect x="750" y="862" width="580" height="70" rx="12" fill="#dc2626"/>
  <text x="1040" y="895" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">✕  Compra bloqueada</text>
  <text x="1040" y="921" text-anchor="middle" font-size="16" fill="#ffffff">e o Bruno recebe um alerta no celular</text>

  <!-- Rodapé -->
  <text x="700" y="1003" text-anchor="middle" font-size="18" fill="#334155">O cliente não precisa fazer nada: <tspan font-weight="700">a operadora já sabe em que região o celular está</tspan>.</text>
</svg>
